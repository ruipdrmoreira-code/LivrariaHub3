<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LivrariaHub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>LivrariaHub</h1>
        <p>Catalogo proprio com dados da tua base MySQL.</p>
      </div>
    </header>

    <main class="container">
      <section class="filtros">
        <input id="pesquisa" type="text" placeholder="Pesquisar por titulo, editora ou ISBN..." />
        <select id="tipo">
          <option value="">Todos os tipos</option>
        </select>
        <button id="btnAtualizar">Atualizar</button>
      </section>

      <section class="status">
        <span id="contador">A carregar...</span>
      </section>

      <section id="gridLivros" class="grid"></section>
    </main>

    <template id="templateLivro">
      <article class="card">
        <h3 class="titulo"></h3>
        <p class="meta editora"></p>
        <p class="meta tipo"></p>
        <p class="meta isbn"></p>
        <p class="preco"></p>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
